build Docker image builder:
  extends: .build Docker image
  variables:
    DOCKER_DOCKERFILE_PATH: .gitlab/docker/builder

test Docker image builder:
  stage: docker test
  extends: .docker in docker
  script:
    - export IMAGE_NAME="$(echo $CI_JOB_NAME | sed 's/test Docker image \(.*\)/\1/')"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker pull "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_REF_SLUG"
    - >
      docker run -rm "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_REF_SLUG" sh -c "
        scripts/gen_config.py tplinkC6 prpl webui &&
        make -j $(nproc) tools/tar/compile
        "
    - >
      docker run -rm "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_REF_SLUG" sh -c "
        scripts/gen_config.py intel_mips prpl webui &&
        make -j $(nproc) tools/tar/compile
        "

deploy Docker image builder:
  stage: docker deploy
  extends: .deploy Docker image
