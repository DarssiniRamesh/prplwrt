---
description: Add the prpl features
feeds:
  - name: feed_prpl
    uri: https://gitlab.com/prpl-foundation/prplOS/feed-prpl.git
    tracking_branch: prplos
    revision: cd2fdeae858986580b85876b76ab992117c60227

additional_packages:
  - feed: packages
    packages:
      - chrony
      - libnl-core
      - libnl-route
      - syslog-ng

packages:
  - acl-manager
  - amx-cli
  - bbfd
  - cthulhu
  - cthulhu-lxc
  - deviceinfo-manager
  - dhcpv4-manager
  - dhcpv6s-manager
  - ethernet-manager
  - ip-manager
  - libdhcpoptions
  - libfwinterface
  - libfwrules
  - libnetmodel
  - mod-amxb-ubus
  - mod-ba-cli
  - mod-dmext
  - mod-dmstats
  - mod-vlan-ioctl
  - mod-sahtrace
  - netdev-plugin
  - netmodel
  - obuspa
  - odl-generator
  - owsd
  - pcm-manager
  - prplmesh
  - rlyeh
  - routing-manager
  - time-manager
  - timingila
  - timingila-cthulhu
  - timingila-rlyeh
  - tr181-bridging
  - tr181-device
  - tr181-dhcpv4client
  - tr181-dhcpv6client
  - tr181-firewall
  - tr181-usermanagement
  - u80211d
  - ucwmp
  - umdns
  - wan-manager

diffconfig: |
          CONFIG_PACKAGE_rpcd-mod-luci=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ip-bridge=y
          # CONFIG_PACKAGE_firewall is not set
          # CONFIG_PACKAGE_logd is not set
          # lxc options for LCM
          CONFIG_PACKAGE_liblxc=y
          # CONFIG_PACKAGE_rpcd-mod-lxc is not set
          # CONFIG_PACKAGE_luci-app-lxc is not set
          CONFIG_PACKAGE_lxc=y
          CONFIG_PACKAGE_lxc-attach=y
          CONFIG_PACKAGE_lxc-auto=y
          CONFIG_PACKAGE_lxc-autostart=y
          CONFIG_PACKAGE_lxc-cgroup=y
          CONFIG_PACKAGE_lxc-checkconfig=y
          CONFIG_PACKAGE_lxc-common=y
          CONFIG_PACKAGE_lxc-config=y
          CONFIG_PACKAGE_lxc-configs=y
          CONFIG_PACKAGE_lxc-console=y
          CONFIG_PACKAGE_lxc-copy=y
          CONFIG_PACKAGE_lxc-create=y
          CONFIG_PACKAGE_lxc-destroy=y
          CONFIG_PACKAGE_lxc-device=y
          CONFIG_PACKAGE_lxc-execute=y
          CONFIG_PACKAGE_lxc-freeze=y
          CONFIG_PACKAGE_lxc-hooks=y
          CONFIG_PACKAGE_lxc-info=y
          # CONFIG_PACKAGE_lxc-init is not set
          CONFIG_PACKAGE_lxc-ls=y
          CONFIG_PACKAGE_lxc-monitor=y
          # CONFIG_PACKAGE_lxc-monitord is not set
          # CONFIG_PACKAGE_lxc-snapshot is not set
          CONFIG_PACKAGE_lxc-start=y
          CONFIG_PACKAGE_lxc-stop=y
          CONFIG_PACKAGE_lxc-templates=y
          CONFIG_PACKAGE_lxc-top=y
          CONFIG_PACKAGE_lxc-unfreeze=y
          CONFIG_PACKAGE_lxc-unprivileged=y
          CONFIG_PACKAGE_lxc-unshare=y
          CONFIG_PACKAGE_lxc-user-nic=y
          CONFIG_PACKAGE_lxc-usernsexec=y
          CONFIG_PACKAGE_lxc-wait=y
          CONFIG_PACKAGE_libnl-core=y
          CONFIG_PACKAGE_libnl-route=y
          CONFIG_SAH_SERVICES_CTHULHU_INIT_CONTAINER_BACKEND=y
          CONFIG_SAH_SERVICES_CTHULHU_CONTAINER_BACKEND="/usr/lib/cthulhu-lxc/cthulhu-lxc.so"
          CONFIG_SAH_SERVICES_TIMINGILA_INIT_ADAPTERS=y
          CONFIG_SAH_SERVICES_TIMINGILA_ADAPTER_PACKAGER="/usr/lib/timingila-rlyeh/timingila-rlyeh.so"
          CONFIG_SAH_SERVICES_TIMINGILA_ADAPTER_CONTAINER="/usr/lib/timingila-cthulhu/timingila-cthulhu.so"
          # kernel options for lcm
          CONFIG_KERNEL_ARM_PMU=y
          CONFIG_KERNEL_BLK_CGROUP=y
          CONFIG_KERNEL_BLK_DEV_THROTTLING=y
          CONFIG_KERNEL_CGROUPS=y
          CONFIG_KERNEL_CGROUP_CPUACCT=y
          CONFIG_KERNEL_CGROUP_DEVICE=y
          CONFIG_KERNEL_CGROUP_FREEZER=y
          CONFIG_KERNEL_CGROUP_PERF=y
          CONFIG_KERNEL_CGROUP_PIDS=y
          CONFIG_KERNEL_CGROUP_SCHED=y
          CONFIG_KERNEL_CPUSETS=y
          CONFIG_KERNEL_DEVPTS_MULTIPLE_INSTANCES=y
          CONFIG_KERNEL_FAIR_GROUP_SCHED=y
          CONFIG_KERNEL_FREEZER=y
          CONFIG_KERNEL_IPC_NS=y
          CONFIG_KERNEL_LXC_MISC=y
          CONFIG_KERNEL_MEMCG=y
          CONFIG_KERNEL_MEMCG_KMEM=y
          CONFIG_KERNEL_MEMCG_SWAP=y
          CONFIG_KERNEL_MEMCG_SWAP_ENABLED=y
          CONFIG_KERNEL_MM_OWNER=y
          CONFIG_KERNEL_NAMESPACES=y
          CONFIG_KERNEL_NETPRIO_CGROUP=y
          CONFIG_KERNEL_NET_CLS_CGROUP=y
          CONFIG_KERNEL_NET_NS=y
          CONFIG_KERNEL_PERF_EVENTS=y
          CONFIG_KERNEL_PID_NS=y
          CONFIG_KERNEL_POSIX_MQUEUE=y
          CONFIG_KERNEL_PROC_PID_CPUSET=y
          CONFIG_KERNEL_RESOURCE_COUNTERS=y
          CONFIG_KERNEL_RT_GROUP_SCHED=y
          CONFIG_KERNEL_SECCOMP=y
          CONFIG_KERNEL_SECCOMP_FILTER=y
          CONFIG_KERNEL_USER_NS=y
          CONFIG_KERNEL_UTS_NS=y
          CONFIG_PACKAGE_kmod-veth=y
